name: Container image

# Publishes the image the demo deployment pulls. The `docker` job in ci.yml
# still builds on pull requests, where `packages: write` would not be safe;
# this workflow runs only after merge and on releases.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push:
    name: Build and push to GHCR
    # The demo runs on one machine, so build for that machine only. If the box
    # is aarch64 (Lightsail offers Graviton plans), switch to
    # `ubuntu-24.04-arm` — native and free for public repos. Do not add QEMU
    # multi-arch: emulating `npm ci`/`vite build` takes 20-40 minutes and there
    # is exactly one target.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # sha-<short> is the immutable tag the deployment pins. `latest` and
          # `main` are conveniences for `docker run`, never for the box.
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the pushed image
        run: |
          docker run -d --name smoke -p 8721:8721 \
            -e OPENDSS_DESIGNER_ALLOWED_HOSTS=127.0.0.1,localhost \
            ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          for i in $(seq 40); do
            curl -sf http://127.0.0.1:8721/api/health >/dev/null && break || sleep 2
          done
          curl -sf http://127.0.0.1:8721/api/health | grep -q '"mode":"demo"'
          # The container must report healthy, not merely be running: the
          # HEALTHCHECK requests Host 127.0.0.1, which the Host allowlist
          # rejects unless loopback is included.
          for i in $(seq 20); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' smoke)" = healthy ] && break || sleep 3
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' smoke)" = healthy
          docker rm -f smoke

      - name: Report the deployable tag
        run: |
          {
            echo "### Deployable image"
            echo
            echo '```'
            echo "IMAGE_TAG=sha-$(echo ${{ github.sha }} | cut -c1-7)"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
            echo "Set \`IMAGE_TAG\` in the deployment repo's \`.env\`, then \`make deploy\`."
          } >> "$GITHUB_STEP_SUMMARY"
