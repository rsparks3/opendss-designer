name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; no job here needs to write to the repo.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  frontend:
    name: Frontend (tsc + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e ".[dev]"
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      # Install first so the audit covers this project's actual dependency
      # tree, not an empty environment. No --strict: it makes an
      # un-auditable local package fatal, which is not a vulnerability.
      - run: pip install -e "." pip-audit
      - run: pip-audit --desc
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm audit --audit-level=high
        working-directory: frontend

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install ruff
      - run: ruff check .

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t opendss-designer:ci .
      - name: Container serves a hardened, demo-limited app
        run: |
          docker run -d --name ci -p 8721:8721 opendss-designer:ci
          for i in $(seq 30); do
            curl -sf http://127.0.0.1:8721/api/health >/dev/null && break || sleep 2
          done
          curl -sf http://127.0.0.1:8721/api/health | grep -q '"mode":"demo"'
          # The conductor presets must ship inside the wheel.
          test "$(curl -sf http://127.0.0.1:8721/api/linecodes | grep -o '"code"' | wc -l)" -gt 0
          # Path traversal must not resurface on Linux.
          curl -s --path-as-is http://127.0.0.1:8721/%2e%2e/%2e%2e/etc/passwd | grep -qv 'root:'
