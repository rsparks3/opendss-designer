[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opendss-designer"
version = "0.1.2"
description = "A graphical user interface (GUI) for OpenDSS: draw one-line diagrams in your browser, run power flows, import and export .dss files"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ryan Sparks", email = "ryan@ryanmsparks.com" }]
keywords = [
    "opendss", "power-flow", "power-systems", "distribution-system",
    "one-line-diagram", "single-line-diagram", "gui", "graphical-interface",
    "electrical-engineering", "opendssdirect", "epri",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "opendssdirect.py>=0.9",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx"]

[project.urls]
Homepage = "https://opendssdesigner.ryanmsparks.com"
Documentation = "https://opendssdesigner.ryanmsparks.com"
Repository = "https://github.com/rsparks3/opendss-designer"
Issues = "https://github.com/rsparks3/opendss-designer/issues"

[project.scripts]
opendss-designer = "opendss_designer.cli:main"

# The packaged frontend build is gitignored; artifacts (unlike force-include)
# bundles it when present without failing on a fresh checkout where it isn't.
# Set at build level (not per-target): `python -m build` builds the wheel FROM
# the sdist, so the sdist must carry static/ too or the wheel loses it.
[tool.hatch.build]
artifacts = ["src/opendss_designer/static/"]

[tool.hatch.build.targets.wheel]
packages = ["src/opendss_designer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
