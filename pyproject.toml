[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opendss-designer"
version = "0.5.1"
description = "A graphical user interface (GUI) for OpenDSS: draw one-line diagrams in your browser, run power flows, import and export .dss files"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Ryan Sparks", email = "ryan@ryanmsparks.com" }]
keywords = [
    "opendss", "power-flow", "power-systems", "distribution-system",
    "one-line-diagram", "single-line-diagram", "gui", "graphical-interface",
    "electrical-engineering", "opendssdirect", "epri",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "opendssdirect.py>=0.9",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx", "ruff"]

[project.urls]
Homepage = "https://opendssdesigner.ryanmsparks.com"
Documentation = "https://opendssdesigner-docs.ryanmsparks.com"
Repository = "https://github.com/rsparks3/opendss-designer"
Issues = "https://github.com/rsparks3/opendss-designer/issues"

[project.scripts]
opendss-designer = "opendss_designer.cli:main"

# The packaged frontend build is gitignored; artifacts (unlike force-include)
# bundles it when present without failing on a fresh checkout where it isn't.
# Set at build level (not per-target): `python -m build` builds the wheel FROM
# the sdist, so the sdist must carry static/ too or the wheel loses it.
[tool.hatch.build]
artifacts = ["src/opendss_designer/static/"]

[tool.hatch.build.targets.wheel]
packages = ["src/opendss_designer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "B008",  # FastAPI's Depends()/Body() defaults are the documented idiom
    "E741",  # `l` reads fine for a loop/line variable in this domain
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private helpers on purpose: that is what is being pinned.
"tests/*" = ["E501"]
