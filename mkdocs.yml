site_name: OpenDSS Designer
site_description: >-
  A graphical user interface (GUI) for OpenDSS — draw one-line diagrams in
  your browser, run power flows, and import/export .dss files.
site_url: https://opendssdesigner-docs.ryanmsparks.com/
repo_url: https://github.com/rsparks3/opendss-designer
repo_name: rsparks3/opendss-designer

theme:
  name: material
  icon:
    logo: material/transmission-tower
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.footer
    - content.code.copy

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Components: components.md
  - Solving & analysis: analysis.md
  - Shapes & profiles: shapes.md
  - Time-series analysis: timeseries.md
  - Importing DSS files: importing-dss.md
  - Deploying: deployment.md
  - Security: security.md
  - Development:
      - Contributing: development.md
      - Adding an element type: adding-an-element.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.superfences
  - pymdownx.keys
  - toc:
      permalink: true
